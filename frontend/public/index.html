<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- CheckSphere: branded loading screen while the app's JavaScript downloads (React replaces #root's content). -->
    <style id="checksphere-boot">
      #root:empty {
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: linear-gradient(#1f4e3d, #12293a);
      }
      #root:empty::before {
        content: "CheckSphere";
        color: #ffffff;
        font: 800 30px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.5px;
      }
      #root:empty::after {
        content: "";
        width: 28px;
        height: 28px;
        margin-top: 24px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: checksphere-spin 0.8s linear infinite;
      }
      @keyframes checksphere-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
